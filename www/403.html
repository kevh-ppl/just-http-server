<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 — Acceso prohibido</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(76, 110, 245, .2), transparent 55%),
        #0b1020;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 28px;
      background: rgba(19, 27, 49, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #9eafff;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: .95;
      letter-spacing: -.08em;
      background: linear-gradient(135deg, #fff 20%, #9eafff 75%, #71e3d1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      margin: 24px 0 10px;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
    }

    p {
      max-width: 42ch;
      margin: 0 auto;
      color: #aab4ce;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 13px 20px;
      border-radius: 12px;
      background: #8296ff;
      color: #10162b;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    a:hover {
      transform: translateY(-2px);
      background: #a3b1ff;
    }

    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Acceso restringido</p>
    <h1>403</h1>
    <h2>No tienes permiso para acceder</h2>
    <p>El servidor no permite acceder a este recurso.</p>
    <a href="/">Volver al inicio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
